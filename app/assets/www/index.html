<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>حفظ</title><style>
@font-face{font-family:Amiri;src:url(Amiri.ttf)}
:root{--g:#0b3d2e;--g2:#14684a;--l:#2ecc71;--t:#e8fff3}
*{box-sizing:border-box}body{margin:0;background:var(--g);color:var(--t);font-family:sans-serif}
header{position:sticky;top:0;background:#062a1f;display:flex;gap:6px;padding:8px;align-items:center;z-index:2}
header b{flex:1;font-family:Amiri;font-size:22px;color:var(--l)}
.st{font-size:13px;opacity:.9}
button,select{background:var(--g2);color:var(--t);border:1px solid #2a8c66;border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit}
button:active{background:var(--l);color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;padding:10px}
.card{background:var(--g2);border-radius:12px;padding:10px;text-align:center}
.hot{border:2px solid var(--l)}
.ar{font-family:Amiri;font-size:28px;line-height:2.1;direction:rtl}
.tr{direction:ltr;text-align:left;color:#a8f0c8;font-size:15px;margin:4px 0}
.mu{font-family:Amiri;font-size:18px;color:#cfe;background:#06291e;padding:8px;border-radius:8px;margin-top:6px}
.ay{background:#0f4a37;margin:8px 10px;padding:10px;border-radius:12px}
.n{color:var(--l);font-size:14px}.hid{filter:blur(9px)}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px}
h3{margin:12px 10px 0;color:var(--l);font-family:Amiri}
.opt{display:block;width:100%;margin:6px 0;text-align:right;font-family:Amiri;font-size:22px}
.ok{background:#1e8449!important}.bad{background:#7b241c!important}
#timer{height:6px;background:var(--l);transition:width .2s linear}
.blank{color:var(--l);border-bottom:2px dashed var(--l);padding:0 20px}
</style></head><body>
<header><b>حِفْظ</b><span class="st" id="stat"></span><button onclick="home()">⌂</button></header>
<div id="v"></div>
<script src="quran.js"></script>
<script>
const S=Q.s,A=Q.a,v=document.getElementById('v');
const P=JSON.parse(localStorage.hifz||'{"xp":0,"streak":0,"best":0,"day":"","days":0,"known":{}}');
function save(){localStorage.hifz=JSON.stringify(P);stat()}
function stat(){document.getElementById('stat').textContent='⚡'+P.xp+' 🔥'+P.streak+' (أفضل '+P.best+') 📅'+P.days+' ✓'+Object.keys(P.known).length}
(function(){const d=new Date().toDateString();if(P.day!==d){P.day=d;P.days++;save()}else stat()})();
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const key=a=>a[0]+':'+a[1];
let pool=[],sel={t:'j',x:30};
function setPool(t,x){sel={t,x};pool=A.filter(a=>t=='j'?a[2]==x:t=='s'?a[0]==x:a[2]>=25)}
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=a=>a[Math.random()*a.length|0];
const lbl=()=>sel.t=='j'?'الجزء '+ar(sel.x):sel.t=='s'?'سورة '+S[sel.x-1][1]:'الأجزاء ٢٥–٣٠';
function home(){stopT();au.pause();let h='<h3>ابدأ هنا: الأجزاء ٢٥–٣٠</h3><div class="grid">';
h+=`<div class="card hot" onclick="pick('m',0)">٢٥–٣٠<br><small>الكل</small></div>`;
for(let j=25;j<=30;j++)h+=`<div class="card hot" onclick="pick('j',${j})">الجزء<br>${ar(j)}</div>`;
h+='</div><h3>الأجزاء (Ajzaa)</h3><div class="grid">';for(let j=1;j<=24;j++)h+=`<div class="card" onclick="pick('j',${j})">${ar(j)}</div>`;
h+='</div><h3>السور (Suwar)</h3><div class="grid">';S.forEach(s=>h+=`<div class="card" onclick="pick('s',${s[0]})"><span class="n">${ar(s[0])}</span><br><span style="font-family:Amiri;font-size:18px">${s[1]}</span><br><small dir=ltr>${s[2]}</small></div>`);
v.innerHTML=h+'</div>';scrollTo(0,0)}
function pick(t,x){setPool(t,x);menu()}
function menu(){stopT();au.pause();v.innerHTML=`<h3>${lbl()} — ${ar(pool.length)} آية</h3><div class="bar">
<button onclick="read()">📖 قراءة <small>(Qiraa'ah)</small></button>
<button onclick="hideMode()">🙈 إخفاء وكشف <small>(Ikhfaa')</small></button>
<button onclick="gap()">✍️ الكلمة الناقصة <small>(Kalimah)</small></button>
<button onclick="nextA()">➡️ الآية التالية <small>(Taaliyah)</small></button>
<button onclick="blitz()">⏱️ جولة سريعة ٦٠ث <small>(Sur'ah)</small></button></div>`;scrollTo(0,0)}
function ayHTML(a,hide){return `<div class="ay"><span class="n">${S[a[0]-1][1]} ${ar(a[1])} ${P.known[key(a)]?'✓':''}</span>
<div class="ar ${hide?'hid':''}" onclick="this.classList.toggle('hid')">${a[3]} ﴿${ar(a[1])}﴾</div><div class="tr ${hide?'hid':''}" onclick="this.classList.toggle('hid')">${a[4]}</div>
<details><summary>التفسير الميسر</summary><div class="mu">${a[5]}</div></details>
<button class="pl" id="pl${A.indexOf(a)}" onclick="play(${A.indexOf(a)})">▶ استماع</button> <button onclick="P.known['${key(a)}']=1;P.xp+=1;save();this.textContent='✓'">✓ حفظت</button></div>`}
let lim=40;
function read(hide){lim=40;rr(hide)}
function rr(hide){v.innerHTML=`<div class="bar"><button onclick="menu()">↩</button><button onclick="document.querySelectorAll('.ar,.tr').forEach(e=>e.classList.add('hid'))">🙈 إخفاء الكل</button><button onclick="document.querySelectorAll('.hid').forEach(e=>e.classList.remove('hid'))">👁 كشف الكل</button><label>🔁 تكرار <select onchange="P.rep=+this.value;save()">${[1,2,3,5,7,10,20].map(n=>`<option ${n==(P.rep||1)?"selected":""}>${n}</option>`).join("")}</select></label><label><input type="checkbox" ${P.auto?"checked":""} onchange="P.auto=this.checked;save()"> ▶▶ تشغيل تلقائي</label><button onclick="au.pause()">⏸</button></div>`+pool.slice(0,lim).map(a=>ayHTML(a,hide)).join('')+(lim<pool.length?`<div class="bar"><button onclick="lim+=40;rr(${!!hide})">المزيد ⬇</button></div>`:'')}
function hideMode(){read(true)}
const au=new Audio();let cur=-1,left=0;
function play(i,keep){cur=i;if(!keep)left=(P.rep||1);document.querySelectorAll('.pl').forEach(b=>b.textContent='▶ استماع');const b=document.getElementById('pl'+i);if(b){b.textContent='🔊 ...';b.scrollIntoView({block:'center',behavior:'smooth'})}
au.src='https://cdn.islamic.network/quran/audio/128/ar.alafasy/'+(i+1)+'.mp3';au.play().catch(()=>{if(b)b.textContent='⚠ لا اتصال'})}
au.onended=()=>{left--;if(left>0)return play(cur,true);const n=cur+1;if(P.auto&&n<6236&&pool.includes(A[n])){if(!document.getElementById('pl'+n)&&document.getElementById('pl'+cur)){lim+=40;rr(false)}play(n)}else document.querySelectorAll('.pl').forEach(b=>b.textContent='▶ استماع')};
au.onerror=()=>{const b=document.getElementById('pl'+cur);if(b)b.textContent='⚠ لا اتصال'};
function win(ok){if(ok){P.streak++;P.xp+=3;if(P.streak>P.best)P.best=P.streak}else P.streak=0;save()}
let score=0,tEnd=0,tI=null,blz=false;
function stopT(){clearInterval(tI);tI=null;blz=false;document.getElementById('timer')?.remove()}
function quiz(q,opts,ans,after){v.innerHTML=(blz?'<div id="timer"></div>':'')+`<div class="bar"><button onclick="menu()">↩</button>${blz?'<span>النقاط: '+ar(score)+'</span>':''}</div>${q}<div style="padding:0 10px">`+opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')+'</div>';
const inB=blz;let done=false;v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done||(inB&&(!blz||Date.now()>=tEnd)))return;done=true;const ok=+b.dataset.i==ans;b.classList.add(ok?'ok':'bad');v.querySelectorAll('.opt')[ans].classList.add('ok');win(ok);if(blz&&ok)score++;setTimeout(()=>{if(inB&&!blz)return;after()},ok?(blz?250:600):(blz?700:1400))});tick()}
function gap(){blz=blz;const c=pool.filter(a=>a[3].split(' ').length>=3);if(!c.length)return nextA();const a=rnd(c),w=a[3].split(' '),i=Math.random()*w.length|0,ans=w[i];
const all=pool.flatMap(x=>x[3].split(' ')).filter(x=>x!==ans&&x.length>1);const o=sh([ans,...sh(all).slice(0,3)]);
w[i]='<span class="blank">؟</span>';quiz(`<div class="ay"><span class="n">${S[a[0]-1][1]} ${ar(a[1])}</span><div class="ar">${w.join(' ')}</div></div>`,o,o.indexOf(ans),blz?nx:gap)}
function nextA(){const c=pool.filter(a=>A.indexOf(a)<6235&&A[A.indexOf(a)+1][0]==a[0]);if(!c.length)return gap();const a=rnd(c),n=A[A.indexOf(a)+1];
const d=sh(pool.filter(x=>x!==n&&x!==a)).slice(0,3);const o=sh([n,...d]);
quiz(`<div class="ay"><span class="n">ما بعد: ${S[a[0]-1][1]} ${ar(a[1])}</span><div class="ar">${a[3]}</div><div class="tr">${a[4]}</div></div>`,o.map(x=>x[3].length>140?x[3].slice(0,140)+'…':x[3]),o.indexOf(n),blz?nx:nextA)}
function nx(){if(!blz)return;(Math.random()<.5?gap:nextA)()}
function blitz(){stopT();blz=true;score=0;tEnd=Date.now()+60000;tI=setInterval(tick,200);nx()}
function tick(){if(!blz)return;const r=tEnd-Date.now(),t=document.getElementById('timer');if(t)t.style.width=Math.max(0,r/600)+'%';
if(r<=0){clearInterval(tI);tI=null;blz=false;P.xp+=score*2;save();v.innerHTML=`<div class="ay" style="text-align:center"><div class="ar">انتهى الوقت!</div><div style="font-size:40px">${ar(score)}</div><p>Intahaa al-waqt</p><button onclick="blitz()">🔁 مرة أخرى</button> <button onclick="menu()">↩</button></div>`}}
setPool('m',0);home();
</script></body></html>
